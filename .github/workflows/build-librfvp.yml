name: Build librfvp (YukiHub text-scale patch)

# 手动触发的 librfvp.so 构建流水线：
#   拉取 rfvp 源码 → 应用 YukiHub 文字缩放补丁 → cargo 交叉编译 aarch64 → 上传 so
# 补丁脚本与本 workflow 放在同一个仓库根目录。
on:
  workflow_dispatch:
    inputs:
      rfvp_repo:
        description: "rfvp 源码仓库（owner/name）"
        required: true
        default: "xmoezzz/rfvp"
      rfvp_ref:
        description: "rfvp 分支 / tag / commit"
        required: true
        default: "main"
      android_api:
        description: "Android API level（链接器 minSdk）"
        required: true
        default: "24"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout build scripts (this repo)
        uses: actions/checkout@v4

      - name: Checkout rfvp source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.rfvp_repo }}
          ref: ${{ github.event.inputs.rfvp_ref }}
          path: rfvp

      - name: Apply YukiHub patches (text scale + logcat logging)
        run: |
          cp rfvp-build/apply_text_scale_patch.py rfvp/
          cp rfvp-build/apply_android_log_patch.py rfvp/
          cd rfvp
          python3 apply_text_scale_patch.py
          python3 apply_android_log_patch.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Locate NDK bin (don't guess paths, find them)
        run: |
          API="${{ github.event.inputs.android_api }}"
          CLANG="$(find /opt/hostedtoolcache "$HOME" -name "aarch64-linux-android${API}-clang" -type f 2>/dev/null | head -n1)"
          if [ -z "$CLANG" ]; then
            echo "::error::找不到 aarch64-linux-android${API}-clang，NDK 安装位置如下："
            find /opt/hostedtoolcache -maxdepth 4 -type d -name 'ndk*' 2>/dev/null
            exit 1
          fi
          NDK_BIN="$(cd "$(dirname "$CLANG")" && pwd)"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          # cargo 交叉编译链接器/归档器（通过 GITHUB_ENV 对后续步骤生效）
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android${API}-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$NDK_BIN/llvm-ar"
          } >> "$GITHUB_ENV"
          "$NDK_BIN/clang" --version
          "$NDK_BIN/llvm-ar" --version | head -1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rfvp
          key: ${{ github.event.inputs.rfvp_repo }}@${{ github.event.inputs.rfvp_ref }}

      - name: Build librfvp.so (aarch64, release)
        working-directory: rfvp
        run: cargo build --release --lib --target aarch64-linux-android -p rfvp

      - name: Verify exports
        run: |
          SO=rfvp/target/aarch64-linux-android/release/librfvp.so
          test -f "$SO"
          llvm-nm -D "$SO" | grep -E 'rfvp_android_(create|step|set_text_scale|set_forced_font)'
          # 校验补丁确实编译进去了（防止缓存命中导致补丁丢失、却上传旧产物）
          echo "--- 探针字符串检查 ---"
          grep -ao 'YHPROBE [a-z_]*' "$SO" | sort | uniq -c || true
          for k in "YHPROBE get_down" "YHPROBE tile" "YHPROBE big" "YHPROBE load" "YHPROBE parts" "YHPROBE hit seq=" "YHPROBE prim_set_z" "YHPROBE zorder"; do
            if ! grep -qa "$k" "$SO"; then
              echo "::error::librfvp.so 缺少 ['$k'] —— 补丁未生效（很可能是编译缓存问题）"
              exit 1
            fi
          done
          echo "补丁校验通过 ✓"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librfvp-textscale-aarch64
          path: rfvp/target/aarch64-linux-android/release/librfvp.so
          if-no-files-found: error