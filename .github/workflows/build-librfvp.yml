name: Build librfvp (YukiHub text-scale patch)

# 手动触发的 librfvp.so 构建流水线：
#   拉取 rfvp 源码 → 应用 YukiHub 文字缩放补丁 → cargo 交叉编译 aarch64 → 上传 so
# 补丁脚本与本 workflow 放在同一个仓库根目录。
on:
  workflow_dispatch:
    inputs:
      rfvp_repo:
        description: "rfvp 源码仓库（owner/name）"
        required: true
        default: "xmoezzz/rfvp"
      rfvp_ref:
        description: "rfvp 分支 / tag / commit"
        required: true
        default: "main"
      android_api:
        description: "Android API level（链接器 minSdk）"
        required: true
        default: "24"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout build scripts (this repo)
        uses: actions/checkout@v4

      - name: Checkout rfvp source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.rfvp_repo }}
          ref: ${{ github.event.inputs.rfvp_ref }}
          path: rfvp

      - name: Apply YukiHub patches (text scale + logcat logging + movie + audio)
        run: |
          cp rfvp-build/apply_text_scale_patch.py rfvp/
          cp rfvp-build/apply_text_patch.py rfvp/
          cp rfvp-build/apply_android_log_patch.py rfvp/
          cp rfvp-build/apply_movie_patch.py rfvp/
          cp rfvp-build/apply_audio_fix_patch.py rfvp/
          cp rfvp-build/apply_wmv_decoder_patch.py rfvp/
          cp rfvp-build/apply_text_click_patch.py rfvp/
          cp rfvp-build/apply_fvp_additive_blend_patch.py rfvp/
          cp rfvp-build/apply_fvp_mask_dissolve_patch.py rfvp/
          cp rfvp-build/apply_fvp_dissolve_snapshot_patch.py rfvp/
          cp rfvp-build/apply_fvp_jis_tunnel_patch.py rfvp/
          cp rfvp-build/apply_audio_silent_fix_patch.py rfvp/
          cp rfvp-build/apply_fvp_timer_stop_patch.py rfvp/
          cp rfvp-build/apply_fvp_text_cancel_patch.py rfvp/
          cp rfvp-build/apply_fvp_stack_visit_patch.py rfvp/
          cp rfvp-build/apply_fvp_color_probe_patch.py rfvp/
          cd rfvp
          python3 apply_text_scale_patch.py
          python3 apply_text_patch.py
          python3 apply_android_log_patch.py
          python3 apply_movie_patch.py
          python3 apply_audio_fix_patch.py
          python3 apply_wmv_decoder_patch.py
          python3 apply_text_click_patch.py
          # FVP 渲染修复（移植自上游 ffc73809 + e95f275a，只取 Android/wgpu 部分）。
          # 顺序无关，两个脚本都会自适应对方是否已应用。
          python3 apply_fvp_additive_blend_patch.py
          python3 apply_fvp_mask_dissolve_patch.py
          # 转场：改成「擦掉开始时那一帧」，不再盖黑（上游 2a9ff58a）。
          # 依赖上一个补丁，必须紧随其后。
          python3 apply_fvp_dissolve_snapshot_patch.py
          # 「SJIS 替身字」还原（YHFVP-JISTUNNEL-1.0）：表来源支持
          #   - Sakura.dll        （樱花萌放官方简体中文版，二进制 UTF-16LE 表）
          #   - uif_config.json   （UIF 系汉化/机翻补丁，如 HappyMarguerite_CHS）
          # 判据自证（命中率 >= 90%），读不到或不匹配就静默不启用（= 上游行为）。
          # 与 text_patch 顺序无关（锚点刻意避开对方区域），已双顺序实测。
          python3 apply_fvp_jis_tunnel_patch.py
          # 音频：SoundSilentOn / AudioSilentOn 不应真的静音（对齐上游 be92e540 / 10.15 语义）。
          # 带一条 YHPROBE SilentOn 探针，用于确认脚本调用事实。
          python3 apply_audio_silent_fix_patch.py
          # timer 到点即停（YHFVP-TIMERSTOP-1.0，上游 a1091393，issue #49）。
          # 老 FVP 的存档按钮靠 TimerGet(1)==0 判断空闲；rfvp 此前让 elapsed 无限增长，
          # 条件永不成立 -> 按钮点不动。只改 tick()，与其它补丁无锚点重叠。
          python3 apply_fvp_timer_stop_patch.py
          # 线程结束/重启时清掉遗留的 TextWait/TextResume（YHFVP-TEXTCANCEL-1.0，上游 513b3955）。
          # 是「TextResume 守卫」的根治版：守卫在消费端止血，本补丁在源头清除。
          # 锚点刻意避开 apply_text_click_patch 改过的两处守卫，两者可叠加。
          python3 apply_fvp_text_cancel_patch.py
          # prim 树遍历的 visit 缓冲改栈数组（YHFVP-STACKVISIT-1.0，上游 cbe9f1fa）。
          # 纯性能：每帧少 2 次 4KiB 堆分配，渲染结果不变。
          python3 apply_fvp_stack_visit_patch.py
          # 【临时诊断探针 v2】对话框背景颜色/透明度不生效（YHFVP-COLORPROBE-1.0，用完即撤）。
          # v1 在 collect_tree 里打 alpha，17k 条把 logcat 配额打爆（丢弃 60 万行），已废弃。
          # v1 的结论仍然有效：顶层 Group alpha 全为 0，所以「累积父 alpha」这条路是错的。
          # v2 只记录 ColorSet 的每一次写入，量很小（一局几十条）。
          # 排查完请删除本行与本脚本。
          python3 apply_fvp_color_probe_patch.py

      - name: Patch video-sys (ByteBuffer decode mode — fixes OP playback on Qualcomm)
        run: |
          # video-sys 是 rfvp 的依赖（crates.io 0.1.0）。上游把解码器输出渲染进
          # AImageReader 再用 AImage_getPlaneData 读回；但部分 Qualcomm/Oplus 设备
          # 的解码器无视 YUV_420_888 请求，输出 UBWC 私有格式（0x7fa30c06），
          # CPU 永远锁不了 -> 每帧都失败 -> OP 白屏/黑屏。
          # 此补丁改为 ByteBuffer 模式（surface=null），直接读 CPU 可见缓冲：
          #   1) AMediaCodec_configure(surface=null) + color-format=YUV420Flexible
          #   2) AMediaCodec_getOutputBuffer 直读，按 stride/slice-height/color-format
          #      解析布局（支持 planar 与 semi-planar NV12），转 RGBA 后释放
          git clone --depth 1 https://github.com/xmoezzz/video-sys.git video-sys-src
          cd video-sys-src
          git apply --check ../rfvp-build/video-sys-cpu-read.patch
          git apply ../rfvp-build/video-sys-cpu-read.patch
          grep -q 'AMediaCodec_getOutputBuffer' video-sys/src/backend/mediacodec.rs
          # 负向校验：真正的旧路径 API 符号不应再出现在**代码**里（注释中提到名字不算）
          if grep -vE '^[[:space:]]*//' video-sys/src/backend/mediacodec.rs | grep -qE 'AImageReader_new|AImageReader_getWindow|AImageReader_acquireLatestImage|AImage_getPlaneData'; then
            echo "::error::video-sys 仍含 AImageReader/AImage 旧路径 API —— 补丁未生效"
            exit 1
          fi
          echo "video-sys ByteBuffer 补丁已应用 ✓"
          # 让 rfvp 工作区改用本地补丁版 video-sys（覆盖 crates.io 版本）
          cd ../rfvp
          cat >> Cargo.toml <<'TOML'
          # YukiHub patch: use locally patched video-sys (ByteBuffer decode fix, see workflow).
          [patch.crates-io]
          video-sys = { path = "../video-sys-src/video-sys" }
          TOML
          grep -A3 'patch.crates-io' Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Locate NDK bin (don't guess paths, find them)
        run: |
          API="${{ github.event.inputs.android_api }}"
          CLANG="$(find /opt/hostedtoolcache "$HOME" -name "aarch64-linux-android${API}-clang" -type f 2>/dev/null | head -n1)"
          if [ -z "$CLANG" ]; then
            echo "::error::找不到 aarch64-linux-android${API}-clang，NDK 安装位置如下："
            find /opt/hostedtoolcache -maxdepth 4 -type d -name 'ndk*' 2>/dev/null
            exit 1
          fi
          NDK_BIN="$(cd "$(dirname "$CLANG")" && pwd)"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          # cargo 交叉编译链接器/归档器（通过 GITHUB_ENV 对后续步骤生效）
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android${API}-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$NDK_BIN/llvm-ar"
          } >> "$GITHUB_ENV"
          "$NDK_BIN/clang" --version
          "$NDK_BIN/llvm-ar" --version | head -1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rfvp
          key: ${{ github.event.inputs.rfvp_repo }}@${{ github.event.inputs.rfvp_ref }}

      - name: Build librfvp.so (aarch64, release)
        working-directory: rfvp
        run: cargo build --release --lib --target aarch64-linux-android -p rfvp

      - name: Verify exports
        run: |
          SO=rfvp/target/aarch64-linux-android/release/librfvp.so
          test -f "$SO"
          llvm-nm -D "$SO" | grep -E 'rfvp_android_(create|step|set_text_scale|set_forced_font)'
          # 诊断探针已全部移除（点击补全已验证稳定）——产物里**不应**再出现 YHPROBE。
          # 例外：颜色探针（对话框背景排查中），只允许 `YHPROBE COLOR` 这一条，
          # 其它任何 YHPROBE 仍然 fail。排查完删掉 apply_fvp_color_probe_patch.py 后，
          # 本段自动回到「一条都不许有」。
          STRAY=$(grep -ao 'YHPROBE [A-Za-z]*' "$SO" | sort -u | grep -v '^YHPROBE COLOR$' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::librfvp.so 仍含未授权的 YHPROBE 诊断探针：$STRAY"
            exit 1
          fi
          if grep -qa 'YHPROBE COLOR' "$SO"; then
            echo "::warning::颜色探针在产物中（对话框背景排查期，属预期）"
          else
            echo "无诊断探针 ✓（YHPROBE 已全部移除）"
          fi
          # 颜色探针若被打上，标记必须也在（防止探针被静默漏掉）
          if grep -qa 'YHFVP-COLORPROBE' "$SO"; then
            echo "颜色探针标记已编入 ✓ ($(grep -ao 'YHFVP-COLORPROBE-[0-9.]*' "$SO" | head -1))"
          fi
          # 外部文本替换补丁必须编进去（防止缓存命中导致补丁丢失、却上传旧产物）
          if grep -qa 'YHFVP-TEXTPATCH' "$SO"; then
            echo "外部文本替换补丁已编入 ✓ ($(grep -ao 'YHFVP-TEXTPATCH-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含 text_patch 补丁（缺 YHFVP-TEXTPATCH 标识）—— apply_text_patch.py 未生效"
            exit 1
          fi
          # FVP 渲染修复（mask dissolve）必须编进去
          if grep -qa 'YHFVP-MASKDISSOLVE' "$SO"; then
            echo "FVP mask-dissolve 补丁已编入 ✓ ($(grep -ao 'YHFVP-MASKDISSOLVE-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含 mask dissolve 补丁（缺 YHFVP-MASKDISSOLVE 标识）—— apply_fvp_mask_dissolve_patch.py 未生效"
            exit 1
          fi
          # SJIS 替身字还原必须编进去
          if grep -qa 'YHFVP-JISTUNNEL' "$SO"; then
            echo "SJIS 替身字还原补丁已编入 ✓ ($(grep -ao 'YHFVP-JISTUNNEL-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含 jis-tunnel 补丁（缺 YHFVP-JISTUNNEL 标识）—— apply_fvp_jis_tunnel_patch.py 未生效"
            exit 1
          fi
          # 转场快照（擦掉起始帧）必须编进去
          if grep -qa 'YHFVP-DISSOLVESNAPSHOT' "$SO"; then
            echo "转场快照补丁已编入 ✓ ($(grep -ao 'YHFVP-DISSOLVESNAPSHOT-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含转场快照补丁（缺 YHFVP-DISSOLVESNAPSHOT 标识）—— apply_fvp_dissolve_snapshot_patch.py 未生效"
            exit 1
          fi
          # timer 到点即停（issue #49）必须编进去
          if grep -qa 'YHFVP-TIMERSTOP' "$SO"; then
            echo "timer 到点即停补丁已编入 ✓ ($(grep -ao 'YHFVP-TIMERSTOP-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含 timer 到点即停补丁（缺 YHFVP-TIMERSTOP 标识）—— apply_fvp_timer_stop_patch.py 未生效"
            exit 1
          fi
          # 过期文本请求取消必须编进去
          if grep -qa 'YHFVP-TEXTCANCEL' "$SO"; then
            echo "过期文本请求取消补丁已编入 ✓ ($(grep -ao 'YHFVP-TEXTCANCEL-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含文本请求取消补丁（缺 YHFVP-TEXTCANCEL 标识）—— apply_fvp_text_cancel_patch.py 未生效"
            exit 1
          fi
          # visit 缓冲改栈数组必须编进去
          if grep -qa 'YHFVP-STACKVISIT' "$SO"; then
            echo "visit 栈缓冲补丁已编入 ✓ ($(grep -ao 'YHFVP-STACKVISIT-[0-9.]*' "$SO" | head -1))"
          else
            echo "::error::librfvp.so 未包含 visit 栈缓冲补丁（缺 YHFVP-STACKVISIT 标识）—— apply_fvp_stack_visit_patch.py 未生效"
            exit 1
          fi
          echo "补丁校验通过 ✓"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librfvp-textscale-aarch64
          path: rfvp/target/aarch64-linux-android/release/librfvp.so
          if-no-files-found: error