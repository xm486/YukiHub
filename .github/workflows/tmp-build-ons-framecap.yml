name: tmp-build-ons-framecap

# 临时工作流：编出带「帧率上限」补丁的 libonsyuri.so，并打出一个可直接安装的 APK
# 用完请连同 .tmp-ons/ 目录一起删除。
#
# 为什么需要它：手机上既没有 NDK 也没有 root，编译不了 so；由 GitHub runner 代劳。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 拉取 YukiHub
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 引擎源码钉在 v0.7.7beta —— 与 .tmp-ons/ 里那两个文件同源，
      # 否则"覆盖文件"会引入版本错配。
      - name: 拉取上游引擎源码（v0.7.7beta）
        run: |
          git clone --depth 1 --branch v0.7.7beta \
            https://github.com/YuriSizuku/OnscripterYuri.git upstream

      - name: 用补丁版本覆盖引擎源码
        run: |
          set -e
          cp .tmp-ons/onscripter_main.cpp  upstream/src/onsyuri/onscripter_main.cpp
          cp .tmp-ons/ONScripter_event.cpp upstream/src/onsyuri/ONScripter_event.cpp
          echo "=== 补丁标记自检（三处都应命中）==="
          grep -n "int g_frame_cap_ms = 16;" upstream/src/onsyuri/onscripter_main.cpp
          grep -n "extern int g_frame_cap_ms;" upstream/src/onsyuri/ONScripter_event.cpp
          grep -n "SDL_AddTimer(g_frame_cap_ms" upstream/src/onsyuri/ONScripter_event.cpp
          echo "=== 确认没有行首脏 '+' ==="
          ! grep -n '^+' upstream/src/onsyuri/onscripter_main.cpp

      - name: 检查 Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null || echo "(sdk 目录下暂无 ndk)"

      - name: 保证 ANDROID_NDK_HOME 可用
        run: |
          set -e
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "已有 NDK: $ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            echo "用 runner 自带的 NDK: $ANDROID_NDK_LATEST_HOME"
          else
            echo "未发现预装 NDK，尝试用 sdkmanager 安装"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          fi

      # 官方脚本：自动拉取并编译 SDL2/SDL2_image/ttf/mixer 等依赖，再 gradle 出 APK
      - name: 编译引擎（官方 cross_android.sh）
        working-directory: upstream/script
        run: bash ./cross_android.sh

      - name: 取出 libonsyuri.so
        run: |
          set -e
          mkdir -p out
          APK=$(ls upstream/build_android/outputs/apk/release/*.apk | head -1)
          echo "上游 APK: $APK"
          unzip -l "$APK" | grep -E 'libonsyuri|libSDL2' || true
          unzip -o "$APK" 'lib/*/libonsyuri.so' -d out_apk
          find out_apk -name libonsyuri.so -exec ls -l {} \;
          cp "$(find out_apk -path '*arm64-v8a*' -name libonsyuri.so | head -1)" out/libonsyuri.so
          ls -l out/libonsyuri.so
          sha256sum out/libonsyuri.so
          echo "--- 与仓库内原版对比（应不同）---"
          sha256sum app/src/main/assets/libs/Yuri_0.7.7/libonsyuri.so || true

      - name: 替换仓库内引擎 so
        run: |
          set -e
          cp out/libonsyuri.so app/src/main/assets/libs/Yuri_0.7.7/libonsyuri.so
          ls -l app/src/main/assets/libs/Yuri_0.7.7/libonsyuri.so

      - name: 打出可直接安装的 debug APK
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          ls -l app/build/outputs/apk/debug/*.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-framecap
          if-no-files-found: error
          path: |
            out/libonsyuri.so
            app/build/outputs/apk/debug/*.apk
