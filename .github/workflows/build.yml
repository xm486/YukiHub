# ============================================================================
# YukiHub · 构建 APK 并发布
# ============================================================================
# 触发方式：**仅手动** —— Actions 页面 → 选这个 workflow → Run workflow
#   没有 push / pull_request / schedule
#   → 推代码、别人开 PR **都不会**自动跑（不会再来烦你）
#
# 两种模式自动判断（你什么都不用选）：
#   · 配了签名 Secrets      → 构建**签名 release APK**，mode=release 时直接发 Release
#   · 没配 Secrets（如别人 fork）→ 自动降级构建 **debug APK**，照样能装，可下载 artifact
#
# 签名 Secrets（可选，3 个）：
#   KEYSTORE_BASE64 / KEY_PASSWORD / KEY_ALIAS_PASSWORD
#   ⚠️ fork 出来的仓库**不会**继承 Secrets，需要各自配置；不配也能跑（走 debug）。
#
# 第三方 action 已锁定到 commit SHA（防供应链投毒）。
# 想更新某条：去该 action 仓库取新 tag 的 SHA，同步改 SHA 与右边注释。
# ============================================================================

name: 构建APP并发布

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '产物方式'
        required: true
        type: choice
        default: 'artifact'
        options:
          - artifact
          - release
          - pre-release
      version:
        description: '版本号 (留空则使用 app/build.gradle 中的版本)'
        required: false
        type: string
        default: ''
      notes:
        description: '更新说明'
        required: false
        type: string
        default: ''

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45          # 干净环境首次拉依赖较慢，留足余量（原为 30）
    permissions:
      contents: write            # 发 Release 需要；fork 里需自行开启读写权限

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3        # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407   # v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      # 自动判断能否签名 —— fork 没 Secrets 也能跑
      - name: 检测签名 Secrets（决定 signed / debug）
        id: detect
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到签名 Secrets → 将构建签名版 release APK"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名 Secrets → 自动降级为 debug APK（fork 可直接用）"
          fi

      - name: Read app version
        id: app_version
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set version
        if: ${{ github.event.inputs.mode != 'artifact' }}
        id: set_version
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${{ steps.app_version.outputs.version }}"; fi
          if [ "$V" != "${{ steps.app_version.outputs.version }}" ]; then
            sed -i "s/versionName \".*\"/versionName \"$V\"/" app/build.gradle
          fi
          echo "release_version=$V" >> "$GITHUB_OUTPUT"

      - name: Set artifact name
        id: artifact_name
        run: |
          VER="${{ steps.set_version.outputs.release_version }}"
          if [ -z "$VER" ]; then VER="${{ steps.app_version.outputs.version }}"; fi
          SUFFIX=""
          if [ "${{ steps.detect.outputs.signed }}" != "true" ]; then SUFFIX="-debug"; fi
          echo "name=YukiHub-v${VER}${SUFFIX}" >> "$GITHUB_OUTPUT"

      # 签名配置（只在有 Secrets 时执行）
      - name: Setup release keystore
        if: ${{ steps.detect.outputs.signed == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties << 'EOF'
          releaseStoreFile=release.keystore
          releaseStorePassword=${{ secrets.KEY_PASSWORD }}
          releaseKeyAlias=yukihub
          releaseKeyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}
          EOF

      - name: Build APK（自动选 signed / debug）
        run: |
          chmod +x gradlew
          if [ "${{ steps.detect.outputs.signed }}" = "true" ]; then
            echo "→ ./gradlew assembleRelease"
            ./gradlew assembleRelease
          else
            echo "→ ./gradlew assembleDebug（未配置签名 Secrets）"
            ./gradlew assembleDebug
          fi

      - name: Find APK
        id: apk
        run: |
          DIR=app/build/outputs/apk/release
          if [ "${{ steps.detect.outputs.signed }}" != "true" ]; then DIR=app/build/outputs/apk/debug; fi
          APK=$(find "$DIR" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没在 $DIR 里找到 APK"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02     # v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        if: ${{ github.event.inputs.mode == 'release' && steps.detect.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.set_version.outputs.release_version }}
          name: v${{ steps.set_version.outputs.release_version }}
          body: ${{ github.event.inputs.notes }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false

      - name: Create Pre-Release
        if: ${{ github.event.inputs.mode == 'pre-release' && steps.detect.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.set_version.outputs.release_version }}
          name: v${{ steps.set_version.outputs.release_version }}
          body: ${{ github.event.inputs.notes }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true

      # 想发 Release 但没签名 → 明确提示，而不是悄悄什么都不做
      - name: 提示（未签名时跳过 Release）
        if: ${{ github.event.inputs.mode != 'artifact' && steps.detect.outputs.signed != 'true' }}
        run: echo "::warning::未配置签名 Secrets，已跳过 Release 发布（只产出 debug APK artifact）"
