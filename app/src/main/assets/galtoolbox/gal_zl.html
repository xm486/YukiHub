			--text-tertiary: #b0b0ff;

			--accent-secondary: #8e6afe;

			--particle-color: rgba(100, 150, 255, 0.8);
		}

		[data-theme="light"] {
			--bg-primary: #f5f7fa;
			--bg-secondary: #e4e7f4;
			--bg-tertiary: #d8dcf0;
			--card-bg: rgba(255, 255, 255, 0.7);
			--card-border: rgba(100, 120, 200, 0.15);
			--card-shadow: rgba(0, 0, 0, 0.1);
			--text-primary: #2c3e50;
			--text-secondary: #4a5a7a;
			--text-tertiary: #6a7a9a;
			--accent-primary: #5a7afb;

			--tag-border: rgba(120, 140, 220, 0.2);
			--header-glow: rgba(90, 120, 250, 0.5);
			--particle-color: rgba(90, 120, 250, 0.6);

		* {
			margin: 0;
			padding: 0;

		}

		body {

			min-height: 100vh;
			padding: 20px;
			position: relative;
			overflow-x: hidden;
			color: var(--text-primary);

		body::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;

			animation: float 20s infinite linear;

		@keyframes float {
			0% { transform: translate(0, 0); }
			25% { transform: translate(-5px, -5px); }
			50% { transform: translate(-10px, 0); }
			75% { transform: translate(-5px, 5px); }
			100% { transform: translate(0, 0); }
		}

		/* 主题切换按钮 */
		.theme-toggle {
			position: fixed;
			top: 20px;
			right: 20px;
			width: 50px;
			height: 50px;
			border-radius: 50%;
			background: var(--card-bg);
			backdrop-filter: blur(10px);
			border: 1px solid var(--card-border);
			box-shadow: 0 4px 20px var(--card-shadow);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.5em;
			z-index: 1000;
			transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}

		.theme-toggle:hover {
			transform: scale(1.1) rotate(15deg);
			box-shadow: 0 6px 25px var(--card-shadow);
			border: 1px solid var(--accent-primary);
		}

		/* 返回顶部按钮 */
		.back-to-top {
			position: fixed;
			bottom: 30px;
			right: 30px;
			width: 55px;
			height: 55px;
			border-radius: 50%;
			background: var(--card-bg);
			backdrop-filter: blur(10px);
			border: 1px solid var(--card-border);
			box-shadow: 0 4px 20px var(--card-shadow);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.8em;
			z-index: 1000;
			transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			opacity: 0;
			visibility: hidden;
			transform: translateY(20px);
			color: var(--text-primary);
		}

		.back-to-top.visible {
			opacity: 1;
			visibility: visible;
			transform: translateY(0);
		}

		.back-to-top:hover {
			transform: translateY(-5px) scale(1.1);
			box-shadow: 0 8px 25px var(--accent-primary);
			border: 1px solid var(--accent-primary);
			background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
			color: white;
		}

		/* 头部样式 */
		.header {
			text-align: center;
			margin-bottom: 30px;
			position: relative;
			z-index: 1;
			padding: 20px;
		}

		.header h1 {
			font-size: 2.5em;
			margin-bottom: 10px;
			text-shadow: 0 0 15px var(--header-glow);
			color: var(--text-primary);
			letter-spacing: 1px;
			position: relative;
			display: inline-block;
			font-weight: 700;
			transition: color 0.3s ease;
		}

		.header h1::after {
			content: '';
			position: absolute;
			bottom: -10px;
			left: 50%;
			transform: translateX(-50%);
			width: 80px;
			height: 4px;
			background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-secondary), transparent);
			border-radius: 2px;
			animation: glow 2s infinite alternate;
		}

		@keyframes glow {
			0% { opacity: 0.5; }
			100% { opacity: 1; }
		}

		/* 搜索栏样式 */
		.search-container {
			max-width: 550px;
			margin: 0 auto 25px;
			position: relative;
			z-index: 1;
		}

		.search-box {
			width: 100%;
			padding: 12px 20px;
			font-size: 15px;
			border: none;
			border-radius: 25px;
			background: var(--card-bg);
			backdrop-filter: blur(12px);
			box-shadow: 0 8px 32px var(--card-shadow);
			transition: all 0.4s ease;
			color: var(--text-primary);
			border: 1px solid var(--card-border);
		}

		.search-box:focus {
			outline: none;
			background: var(--card-bg);
			box-shadow: 0 0 20px var(--header-glow);
			border: 1px solid var(--accent-primary);
		}

		.search-box::placeholder {
			color: var(--text-secondary);
			opacity: 0.7;
		}

		/* 卡片容器 */
		.cards-container {
			display: flex;
			flex-direction: column;
			gap: 15px;
			max-width: 800px;
			margin: 0 auto;
			position: relative;
			z-index: 1;
			padding: 0 20px;
		}

		/* 横版卡片样式 - 移除动画效果 */
		.card {
			background: var(--card-bg);
			backdrop-filter: blur(12px);
			border-radius: 12px;
			overflow: hidden;
			border: 1px solid var(--card-border);
			box-shadow: 0 8px 32px var(--card-shadow);
			transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			cursor: pointer;
			position: relative;
		}

		.card:hover {
			transform: translateY(-3px);
			box-shadow: 0 12px 40px var(--card-shadow);
			border: 1px solid var(--accent-primary);
		}

		/* 卡片内部布局 */
		.card-inner {
			display: flex;
			align-items: center;
			padding: 15px;
			gap: 15px;
		}

		/* 圆形头像 */
		.card-avatar {
			width: 60px;
			height: 60px;
			border-radius: 50%;
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.8em;
			background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
			color: var(--text-primary);
			box-shadow: 0 0 15px var(--header-glow);
			transition: all 0.4s ease;
			position: relative;
			overflow: hidden;
		}

		@keyframes shimmer {
			0% { transform: translateX(-100%); }
			100% { transform: translateX(100%); }
		}

		/* 卡片内容区 */
		.card-content {
			flex: 1;
			min-width: 0;
		}

		.card-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 6px;
		}

		.card-title {
			font-size: 1.1em;
			font-weight: 600;
			color: var(--text-primary);
			letter-spacing: 0.3px;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.card-title::before {
			content: '';
			display: inline-block;
			width: 5px;
			height: 5px;
			background: var(--accent-secondary);
			border-radius: 50%;
			box-shadow: 0 0 6px var(--accent-secondary);
		}

		.card-site-type {
			font-size: 0.75em;
			padding: 3px 8px;
			background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
			border-radius: 10px;
			color: white;
			font-weight: 500;
			white-space: nowrap;
			box-shadow: 0 2px 8px var(--card-shadow);
		}

		.card-description {
			color: var(--text-secondary);
			line-height: 1.5;
			font-size: 0.85em;
			font-weight: 300;
			margin-bottom: 8px;
			overflow: hidden;
			text-overflow: ellipsis;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
		}

		.card-tags {
			display: flex;
			gap: 5px;
			flex-wrap: wrap;
		}

		.card-tag {
			padding: 2px 8px;
			background: var(--tag-bg);
			border-radius: 10px;
			font-size: 0.75em;
			color: var(--text-tertiary);
			border: 1px solid var(--tag-border);
			transition: all 0.3s ease;
			white-space: nowrap;
		}

		.card-tag:hover {
			background: var(--accent-primary);
			color: white;
			transform: translateY(-1px);
			border: 1px solid var(--accent-primary);
		}

			padding: 8px 16px;

			border: none;
			border-radius: 6px;
			font-size: 0.85em;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

			overflow: hidden;
			white-space: nowrap;
			box-shadow: 0 4px 15px var(--card-shadow);
			z-index: 1;
		}

		.visit-button::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary));
			opacity: 0;
			transition: opacity 0.4s ease;
			z-index: -1;
		}

		.visit-button:hover {

			box-shadow: 0 8px 20px var(--accent-primary);
		}

			opacity: 1;
		}

		.visit-button:active {
			transform: translateY(0);
			box-shadow: 0 4px 10px var(--card-shadow);
		}

			padding: 40px;

		/* 粒子背景效果 */
		.particles {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			pointer-events: none;
		}

		.particle {
			position: absolute;
			border-radius: 50%;
			background: radial-gradient(circle, var(--particle-color) 0%, transparent 70%);
			animation: float-particle 15s infinite linear;
			filter: blur(1px);
		}

		@keyframes float-particle {
			0% { transform: translateY(0) translateX(0); opacity: 0; }

			100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
		}

				categoryName: "攻略站",
				tags: ["攻略","可能需要🔮"],
				icon: "https://ts1.tc.mm.bing.net/th/id/ODF.cCVc_O0ouPassyXTBj_Cqw?w=32&h=32&qlt=96&pcl=fffffa&o=6&pid=1.2"
			},
			{
				id: 12,
				name: "鸟白岛演绎厅",
				url: "https://www.summerpockets.com/",
				description: "鸟白岛演绎厅-音乐爱好者的社区",
				category: "music",
				categoryName: "音乐站",
				tags: ["音乐","论坛"],
				icon: "https://www.summerpockets.com/wp-content/uploads/2022/12/cropped-d4390e1a-56a2-4758-8038-c919851fff84-192x192.png"
			},
			{
				id: 13,
				name: "YukiHub社区",
				url: "https://yukihub.zh.kg/community/",
				description: "YukiHub社区，为gal玩家提供的一个游戏论坛",
				category: "forum",
				categoryName: "论坛站",
				tags: ["游戏库","论坛"],
				icon: "https://raw.gitcode.com/xm486/YukiHub/files/main/screenshots/icon_new.png"
			},
		];

		// 初始化变量
		let searchTerm = '';

		// 主题切换功能
		const themeToggle = document.getElementById('themeToggle');
		const themeIcon = document.getElementById('themeIcon');
		const html = document.documentElement;

		// 从localStorage加载主题设置
		function loadTheme() {
			const savedTheme = localStorage.getItem('theme') || 'light';
			html.setAttribute('data-theme', savedTheme);
			updateThemeIcon(savedTheme);
		}

		// 更新图标
		function updateThemeIcon(theme) {
			themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
		}

		// 切换主题
		function toggleTheme() {
			const currentTheme = html.getAttribute('data-theme');
			const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
			
			html.setAttribute('data-theme', newTheme);
			localStorage.setItem('theme', newTheme);
			updateThemeIcon(newTheme);
			
			// 添加切换动画
			themeToggle.style.transform = 'scale(1.1) rotate(180deg)';
			setTimeout(() => {
				themeToggle.style.transform = '';
			}, 300);
		}

		// 返回顶部功能
		const backToTopButton = document.getElementById('backToTop');

		function toggleBackToTop() {
			if (window.pageYOffset > 300) {
				backToTopButton.classList.add('visible');
			} else {
				backToTopButton.classList.remove('visible');
			}
		}

		function scrollToTop() {
			window.scrollTo({
				top: 0,
				behavior: 'smooth'
			});
		}

		// 创建粒子背景
		function createParticles() {
			const particlesContainer = document.getElementById('particles');
			const particleCount = 30;
			
			for (let i = 0; i < particleCount; i++) {
				const particle = document.createElement('div');
				particle.classList.add('particle');
				
				const size = Math.random() * 4 + 2;
				const posX = Math.random() * 100;
				const posY = Math.random() * 100 + 100;
				const delay = Math.random() * 15;
				const duration = Math.random() * 10 + 10;
				
				particle.style.width = `${size}px`;
				particle.style.height = `${size}px`;
				particle.style.left = `${posX}%`;
				particle.style.top = `${posY}%`;
				particle.style.animationDelay = `${delay}s`;
				particle.style.animationDuration = `${duration}s`;
				particle.style.opacity = Math.random() * 0.3 + 0.1;
				
				particlesContainer.appendChild(particle);
			}
		}

		// 渲染卡片
		function renderCards() {
			const container = document.getElementById('cardsContainer');
			const loading = document.getElementById('loading');
			
			// 过滤数据
			let filteredData = websiteData.filter(item => {
				return searchTerm === '' || 
					item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
					item.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
					item.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase()));
			});

			// 隐藏加载提示
			loading.style.display = 'none';
			
			// 清空容器
			container.innerHTML = '';
			
			// 渲染卡片（移除动画延迟）
			filteredData.forEach((item) => {
				const card = document.createElement('div');
				card.className = 'card';
				
				card.innerHTML = `
					<div class="card-inner">
						<img class="card-avatar" src="${item.icon}" alt="${item.name}" loading="lazy">
						<div class="card-content">
							<div class="card-header">
								<h3 class="card-title">${item.name}</h3>
								<span class="card-site-type">${item.categoryName}</span>
							</div>
							<p class="card-description">${item.description}</p>
							<div class="card-tags">
								${item.tags.map(tag => `<span class="card-tag">${tag}</span>`).join('')}
							</div>
						</div>
						<button class="visit-button" onclick="visitWebsite('${item.url}')">
							访问 →
						</button>
					</div>
				`;
				
				container.appendChild(card);
			});

			// 如果没有结果
			if (filteredData.length === 0) {
				container.innerHTML = '<div class="loading">没有找到匹配的网站</div>';
			}
		}

		// 访问网站
		function visitWebsite(url) {
			window.open(url, '_blank', 'noopener,noreferrer');
		}

		// 搜索功能
		const searchInput = document.getElementById('searchInput');
		let searchTimeout;

		searchInput.addEventListener('input', function() {
			clearTimeout(searchTimeout);
			searchTimeout = setTimeout(() => {
				searchTerm = this.value;
				renderCards();
			}, 300);
		});

		// 键盘快捷键
		document.addEventListener('keydown', function(e) {
			if (e.ctrlKey && e.key === 'f') {
				e.preventDefault();
				searchInput.focus();
			}
			if (e.key === 'Escape') {
				searchInput.value = '';
				searchTerm = '';
				renderCards();
			}
		});

		// 页面加载完成后初始化
		document.addEventListener('DOMContentLoaded', function() {
			loadTheme();
			createParticles();
			setTimeout(renderCards, 300);
		});

		// 主题切换事件
		themeToggle.addEventListener('click', toggleTheme);

		// 返回顶部事件
		backToTopButton.addEventListener('click', scrollToTop);
		window.addEventListener('scroll', toggleBackToTop);

		// 鼠标移动视差效果（可选，如果影响性能可以移除）
		document.addEventListener('mousemove', function(e) {
			const cards = document.querySelectorAll('.card');
			const mouseX = e.clientX / window.innerWidth;
			const mouseY = e.clientY / window.innerHeight;
			
			cards.forEach((card, index) => {
				const speed = (index % 3 + 1) * 0.5;
				const x = (mouseX - 0.5) * speed;
				const y = (mouseY - 0.5) * speed;
				
				if (window.innerWidth > 768) {
					card.style.transform = `translate(${x}px, ${y}px)`;
				}
			});
		});
	</script>
</body>
</html>
